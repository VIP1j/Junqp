<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Private Bump</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #1a1a1a; color: white; overflow: hidden; }
        #map { height: 100vh; width: 100%; display: none; }
        
        .auth-box, .ui-panel, .chat-panel, .modal-panel { position: absolute; z-index: 1001; background: #2c2c2c; border-radius: 12px; border: 1px solid #444; }
        .auth-box { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 290px; padding: 20px; text-align: center; }
        
        /* Главная панель */
        .ui-panel { 
            top: 10px; left: 10px; width: 310px; max-height: calc(100vh - 80px); 
            overflow-y: auto; padding: 12px; transition: all 0.3s ease; 
        }
        .ui-panel.collapsed .collapsible-content { display: none; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .toggle-btn { background: #444; border: none; color: white; border-radius: 50%; width: 26px; height: 26px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        /* Нижняя мобильная панель навигации */
        .bottom-nav { 
            position: fixed; bottom: 0; left: 0; right: 0; height: 55px; background: #222; 
            border-top: 1px solid #333; z-index: 1002; display: flex; justify-content: space-around; align-items: center; 
        }
        .nav-item { background: none; border: none; color: #888; font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; width: 50%; padding: 5px 0; }
        .nav-item.active { color: #4caf50; font-weight: bold; }
        .nav-item span { font-size: 16px; }

        /* Чат и Модалки */
        .chat-panel { bottom: 65px; right: 10px; width: 300px; height: 380px; display: flex; flex-direction: column; padding: 12px; }
        .chat-messages { flex: 1; overflow-y: auto; background: #1a1a1a; padding: 8px; border-radius: 8px; margin-bottom: 8px; }
        .msg { background: #3d3d3d; padding: 6px 10px; border-radius: 6px; margin-bottom: 6px; font-size: 12px; word-break: break-word; }
        .msg.my { background: #2e7d32; text-align: right; }

        .modal-panel { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 290px; max-height: 380px; overflow-y: auto; display: none; z-index: 1003; padding: 12px; }
        
        /* Список чатов */
        .chat-list-item { background: #383838; padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border-left: 3px solid #2196F3; }
        .chat-list-item.group { border-left-color: #9c27b0; }
        
        /* Элементы управления */
        input, select { width: 100%; padding: 8px 10px; margin: 4px 0; border-radius: 6px; border: 1px solid #444; background: #333; color: white; font-size: 13px; }
        button { background: #4caf50; color: white; border: none; padding: 8px; cursor: pointer; border-radius: 6px; width: 100%; font-size: 12px; font-weight: 600; margin-top: 4px; }
        
        .req, .f-item, .g-item, .admin-item { background: #363636; font-size: 12px; margin-top: 6px; padding: 8px; border-radius: 6px; border-left: 3px solid #4caf50; }
        .g-item { border-left-color: #9c27b0; }
        .admin-item { border-left-color: #e91e63; }
        .admin-panel { background: #231519; border: 1px solid #e91e63; padding: 8px; border-radius: 8px; margin-top: 8px; max-height: 200px; overflow-y: auto; }
        
        .btn-row { display: flex; gap: 4px; margin-top: 4px; flex-wrap: wrap; }
        .del-btn { background: #f44336; }
        .chat-btn { background: #2196F3; }
        .track-btn { background: #ff9800; }
        .add-btn { background: #9c27b0; }
        .mini-btn { padding: 4px 6px; font-size: 10px; margin-top: 0; width: auto; }
        
        .unread-badge { color: #ff5252; font-weight: bold; }
        #typingStatus { font-size: 10px; color: #ffeb3b; font-style: italic; min-height: 14px; }
        
        /* Мобильная адаптация */
        @media (max-width: 600px) {
            .ui-panel { width: calc(100% - 20px); left: 10px; max-height: calc(100vh - 120px); }
            .chat-panel { width: calc(100% - 20px); right: 10px; bottom: 65px; height: 55vh; }
        }

        .leaflet-control-layers { background: #2c2c2c !important; color: white !important; border: 1px solid #444 !important; border-radius: 8px !important; }
    </style>
</head>
<body>

<div id="auth" class="auth-box">
    <h3 style="margin-top:0">Вход / Регистрация</h3>
    <input type="text" id="loginNick" placeholder="Ник">
    <input type="password" id="loginPass" placeholder="Пароль">
    <button onclick="auth()">Зайти</button>
</div>

<div id="ui" class="ui-panel" style="display:none;">
    <div class="panel-header" onclick="toggleMainPanel()">
        <div>
            <div id="myNickDisplay" style="font-weight: bold; color: orange; font-size: 14px;"></div>
            <div id="distanceDisplay" style="font-size: 11px; color: #4caf50;">Пройдено: 0 км</div>
        </div>
        <button class="toggle-btn" id="panelToggleBtn">▼</button>
    </div>
    
    <div class="collapsible-content">
        <hr style="border-color: #444; margin: 8px 0;">
        <input type="text" id="friendNick" placeholder="Ник друга">
        <div class="btn-row">
            <button style="flex:1;" onclick="handleSearch()">Поиск / Добавить</button>
            <button style="flex:1; background: #9c27b0;" onclick="createGroup()">+ Группа</button>
        </div>
        
        <div id="adminPanelContainer"></div>
        <div id="requests"></div>
        <div id="groupsListDisplay"></div>
        <div id="friendsListDisplay"></div>
    </div>
</div>

<!-- Модалка списка диалогов -->
<div id="chatsListModal" class="modal-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <b style="font-size: 14px;">💬 Ваши сообщения</b>
        <button onclick="closeChatsListModal()" style="width: auto; background: #f44336; padding: 2px 8px; margin:0;">✕</button>
    </div>
    <div id="chatsListContainer"></div>
</div>

<!-- Окно открытого чата -->
<div id="chatBox" class="chat-panel" style="display:none;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
        <div style="display:flex; align-items:center; gap: 6px;">
            <button onclick="backToChatsList()" style="width: auto; background: #444; padding: 2px 6px; margin:0; font-size:10px;">← Назад</button>
            <b id="chatTitle" style="font-size: 13px;">Чат</b>
        </div>
        <button onclick="closeChat()" style="width: auto; background: #f44336; padding: 2px 8px; margin:0;">✕</button>
    </div>
    <div id="typingStatus"></div>
    <div id="chatMessages" class="chat-messages"></div>
    <input type="text" id="chatInput" placeholder="Сообщение..." oninput="handleTyping()" onkeypress="if(event.key==='Enter') sendMsg()">
    <button onclick="sendMsg()">Отправить</button>
</div>

<!-- Участники Группы -->
<div id="membersBox" class="modal-panel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
        <b id="membersTitle" style="font-size: 13px;">Участники</b>
        <button onclick="closeMembersModal()" style="width: auto; background: #f44336; padding: 2px 8px; margin:0;">✕</button>
    </div>
    <div id="membersList"></div>
</div>

<div id="map"></div>

<!-- Нижняя навигация -->
<div class="bottom-nav" id="bottomNav" style="display:none;">
    <button class="nav-item active" id="navMap" onclick="switchTab('map')">
        <span>🗺️</span> Карта
    </button>
    <button class="nav-item" id="navChat" onclick="switchTab('chat')">
        <span>💬</span> Чаты
    </button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = { databaseURL: "https://junqp-1a4df-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const ADMIN_NICKS = ["yyyuuuu", "botisq", "kykyzaba"];

    let myNick = localStorage.getItem('bn_nick');
    let myPass = localStorage.getItem('bn_pass');
    let activeChatId = null;
    let activeChatType = null;
    let typingTimeout = null;
    let isPanelCollapsed = false;

    const markers = {}; 
    const polylines = {}; 
    const visibleTracks = {}; 
    const unreadMap = {}; 

    let myMarker = null;
    let myPolyline = null;
    let lastLat = null;
    let lastLon = null;

    const map = L.map('map', { zoomControl: false }).setView([0, 0], 2);
    L.control.zoom({ position: 'topright' }).addTo(map);

    const darkLayer = L.tileLayer('https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}@2x.png', { maxZoom: 19 });
    const satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 18 });
    const streetLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 });

    darkLayer.addTo(map);
    L.control.layers({ "🌑 Темная": darkLayer, "🛰️ Спутник": satelliteLayer, "🗺️ Обычная": streetLayer }, null, { position: 'topright' }).addTo(map);

    if (myNick && myPass) startApp();

    function toggleMainPanel() {
        const panel = document.getElementById('ui');
        const btn = document.getElementById('panelToggleBtn');
        isPanelCollapsed = !isPanelCollapsed;
        
        if (isPanelCollapsed) {
            panel.classList.add('collapsed');
            btn.innerText = '▲';
        } else {
            panel.classList.remove('collapsed');
            btn.innerText = '▼';
        }
    }

    function switchTab(tab) {
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        if (tab === 'map') {
            document.getElementById('navMap').classList.add('active');
            closeChatsListModal();
            closeChat();
        } else if (tab === 'chat') {
            document.getElementById('navChat').classList.add('active');
            openChatsListModal();
        }
    }

    function openChatsListModal() {
        const container = document.getElementById('chatsListContainer');
        container.innerHTML = '';

        db.ref(`friends/${myNick}`).once('value', s => {
            const friends = s.val() || {};
            let hasChats = false;

            for (let fName in friends) {
                hasChats = true;
                const isUnread = unreadMap[fName] ? '<span class="unread-badge">🔴</span>' : '';
                container.innerHTML += `
                    <div class="chat-list-item" onclick="openChat('${fName}', 'user')">
                        <div><b>👤 ${fName}</b> ${isUnread}</div>
                        <span style="font-size:10px; color:#aaa;">Личные</span>
                    </div>`;
            }

            db.ref(`user_groups/${myNick}`).once('value', gSnap => {
                const groups = gSnap.val() || {};
                for (let gId in groups) {
                    hasChats = true;
                    container.innerHTML += `
                        <div class="chat-list-item group" onclick="openChat('${gId}', 'group', '${groups[gId]}')">
                            <div><b>👥 ${groups[gId]}</b></div>
                            <span style="font-size:10px; color:#aaa;">Группа</span>
                        </div>`;
                }

                if (!hasChats) {
                    container.innerHTML = '<div style="font-size:12px; color:#aaa; text-align:center; padding:10px;">У вас пока нет друзей или групп</div>';
                }
            });
        });

        document.getElementById('chatsListModal').style.display = 'block';
    }

    function closeChatsListModal() {
        document.getElementById('chatsListModal').style.display = 'none';
    }

    function backToChatsList() {
        closeChat();
        openChatsListModal();
    }

    function auth() {
        myNick = document.getElementById('loginNick').value.trim();
        myPass = document.getElementById('loginPass').value.trim();
        if (!myNick || !myPass) return alert("Заполни поля!");
        db.ref('users/' + myNick + '/pass').once('value', s => {
            if (s.exists() && s.val() !== myPass) return alert("Пароль не тот!");
            localStorage.setItem('bn_nick', myNick);
            localStorage.setItem('bn_pass', myPass);
            db.ref('users/' + myNick).update({ pass: myPass });
            startApp();
        });
    }

    function startApp() {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('map').style.display = 'block';
        document.getElementById('ui').style.display = 'block';
        document.getElementById('bottomNav').style.display = 'flex';
        document.getElementById('myNickDisplay').innerText = "Ты: " + myNick;
        map.invalidateSize();
        
        updateLocation();
        setInterval(updateLocation, 33000); 
        listenRequests();
        listenFriends();
        listenGroups();
        checkAndInitAdmin();
    }

    function checkAndInitAdmin() {
        if (!ADMIN_NICKS.includes(myNick)) return;

        const container = document.getElementById('adminPanelContainer');
        container.innerHTML = `
            <div class="admin-panel">
                <h4 style="margin:0 0 4px 0; color:#e91e63; font-size:12px;">👑 АДМИН-ПАНЕЛЬ</h4>
                <div id="adminUsersList"></div>
            </div>`;

        db.ref('users').on('value', snap => {
            const users = snap.val() || {};
            const listDiv = document.getElementById('adminUsersList');
            if (!listDiv) return;
            listDiv.innerHTML = '';

            for (let uName in users) {
                if (uName === myNick) continue;
                const uData = users[uName];
                const color = uData.color || '#00ff00';
                const pos = uData.pos ? `${uData.pos.lat.toFixed(4)}, ${uData.pos.lon.toFixed(4)}` : 'Нет гео';

                listDiv.innerHTML += `
                    <div class="admin-item">
                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <b style="color:${color}">${uName}</b>
                            <span style="font-size:9px; color:#bbb;">${pos}</span>
                        </div>
                        <div class="btn-row">
                            <button class="mini-btn chat-btn" onclick="focusUser('${uName}')">📍 Найти</button>
                            <button class="mini-btn track-btn" onclick="toggleFriendTrack('${uName}')">🗺️ Трек</button>
                        </div>
                    </div>`;

                if (uData.pos) {
                    if (markers[uName]) {
                        markers[uName].setLatLng([uData.pos.lat, uData.pos.lon]).setStyle({ fillColor: color });
                    } else {
                        markers[uName] = L.circleMarker([uData.pos.lat, uData.pos.lon], { radius: 8, fillColor: color, color: "white", weight: 2, fillOpacity: 0.9 })
                            .addTo(map).bindPopup(`<b>${uName}</b> (Админ)`);
                    }
                }
            }
        });
    }

    function focusUser(uName) {
        db.ref(`users/${uName}/pos`).once('value', s => {
            const pos = s.val();
            if (pos && pos.lat && pos.lon) {
                map.setView([pos.lat, pos.lon], 16);
                if (markers[uName]) markers[uName].openPopup();
                switchTab('map');
            } else {
                alert("Нет активных координат!");
            }
        });
    }

    function getDistanceInKm(lat1, lon1, lat2, lon2) {
        const R = 6371;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
                  Math.sin(dLon/2) * Math.sin(dLon/2);
        return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
    }

    function calculateTotalDistance(pathArray) {
        let total = 0;
        for (let i = 0; i < pathArray.length - 1; i++) {
            const dist = getDistanceInKm(pathArray[i][0], pathArray[i][1], pathArray[i+1][0], pathArray[i+1][1]);
            if (dist > 0.015) total += dist;
        }
        return total.toFixed(2);
    }

    function updateLocation() {
        navigator.geolocation.getCurrentPosition(p => {
            const { latitude: lat, longitude: lon } = p.coords;
            const now = Date.now();

            if (lastLat !== null && getDistanceInKm(lastLat, lastLon, lat, lon) < 0.01) return;
            
            lastLat = lat;
            lastLon = lon;

            db.ref('users/' + myNick + '/pos').update({ lat, lon, time: now });
            db.ref('users/' + myNick + '/history/' + now).set({ lat, lon });

            db.ref('users/' + myNick).once('value', s => {
                const uData = s.val() || {};
                const color = uData.color || "orange";
                const historyObj = uData.history || {};
                
                const pathArray = Object.keys(historyObj).sort().map(k => [historyObj[k].lat, historyObj[k].lon]);
                document.getElementById('distanceDisplay').innerText = `Пройдено: ${calculateTotalDistance(pathArray)} км`;

                if (myPolyline) {
                    myPolyline.setLatLngs(pathArray).setStyle({color: color});
                } else {
                    myPolyline = L.polyline(pathArray, {color: color, weight: 4, opacity: 0.8}).addTo(map);
                }

                if (myMarker) {
                    myMarker.setLatLng([lat, lon]).setStyle({fillColor: color});
                } else {
                    myMarker = L.circleMarker([lat, lon], { radius: 10, fillColor: color, color: "white", weight: 2, fillOpacity: 1 })
                        .addTo(map).bindPopup(`<b>Ты (${myNick})</b>`);
                    map.setView([lat, lon], 14);
                }
            });
        }, null, {enableHighAccuracy: true});
    }

    function handleSearch() {
        const val = document.getElementById('friendNick').value.trim();
        if (val && val !== myNick) {
            db.ref(`requests/${val}/${myNick}`).set('pending');
            alert("Запрос отправлен!");
        }
    }

    function deleteFriend(fName) {
        if (confirm(`Удалить ${fName}?`)) {
            db.ref(`friends/${myNick}/${fName}`).remove();
            db.ref(`friends/${fName}/${myNick}`).remove();
            if (markers[fName]) { map.removeLayer(markers[fName]); delete markers[fName]; }
            if (polylines[fName]) { map.removeLayer(polylines[fName]); delete polylines[fName]; }
        }
    }

    function drawFriendTrack(fName, uData) {
        if (!visibleTracks[fName]) return;
        const color = uData.color || "#00ff00";
        const historyObj = uData.history || {};
        const fPath = Object.keys(historyObj).sort().map(key => [historyObj[key].lat, historyObj[key].lon]);
        if (fPath.length < 1) return;

        if (polylines[fName]) {
            polylines[fName].setLatLngs(fPath).setStyle({ color: color });
        } else {
            polylines[fName] = L.polyline(fPath, { color: color, weight: 4, opacity: 0.8 }).addTo(map);
        }
    }

    function toggleFriendTrack(fName) {
        visibleTracks[fName] = !visibleTracks[fName];
        if (visibleTracks[fName]) {
            db.ref(`users/${fName}`).once('value', userSnap => {
                const u = userSnap.val();
                if (u) drawFriendTrack(fName, u);
            });
        } else {
            if (polylines[fName]) {
                map.removeLayer(polylines[fName]);
                delete polylines[fName];
            }
        }
    }

    function listenRequests() {
        db.ref(`requests/${myNick}`).on('value', s => {
            const reqs = s.val() || {};
            const div = document.getElementById('requests');
            div.innerHTML = '';
            for (let from in reqs) {
                const reqData = reqs[from];
                
                // Дружба
                if (reqData === 'pending') {
                    div.innerHTML += `<div class="req">Запрос в друзья: <b>${from}</b> 
                        <div class="btn-row"><button class="mini-btn" onclick="accept('${from}')">✅ Да</button> <button class="mini-btn del-btn" onclick="reject('${from}')">❌ Нет</button></div></div>`;
                } 
                // Приглашение в группу от друга
                else if (typeof reqData === 'object' && reqData.type === 'group_invite') {
                    div.innerHTML += `<div class="req">Приглашение в группу <b>"${reqData.gName}"</b> от ${from}
                        <div class="btn-row"><button class="mini-btn" onclick="acceptGroupInvite('${from}', '${reqData.gId}', '${reqData.gName}')">✅ Вступить</button> <button class="mini-btn del-btn" onclick="rejectGroupReq('${from}')">❌ Отклонить</button></div></div>`;
                }
                // Админка: Подтверждение входа от пользователя
                else if (typeof reqData === 'object' && reqData.type === 'group_admin_approval') {
                    div.innerHTML += `<div class="req">Разрешить <b>${reqData.user}</b> войти в группу <b>"${reqData.gName}"</b>?
                        <div class="btn-row"><button class="mini-btn" onclick="approveGroupMember('${from}', '${reqData.gId}', '${reqData.user}', '${reqData.gName}')">✅ Разрешить</button> <button class="mini-btn del-btn" onclick="rejectGroupReq('${from}')">❌ Отказать</button></div></div>`;
                }
            }
        });
    }

    function accept(from) {
        db.ref(`friends/${myNick}/${from}`).set(true);
        db.ref(`friends/${from}/${myNick}`).set(true);
        db.ref(`requests/${myNick}/${from}`).remove();
    }

    function reject(from) { db.ref(`requests/${myNick}/${from}`).remove(); }
    function rejectGroupReq(key) { db.ref(`requests/${myNick}/${key}`).remove(); }

    /* ГРУППЫ И ПРИГЛАШЕНИЯ С ПОДТВЕРЖДЕНИЕМ */
    function createGroup() {
        const gName = prompt("Название группы:");
        if (!gName) return;
        const gId = 'group_' + Date.now();
        db.ref(`groups/${gId}`).set({ 
            name: gName, 
            admin: myNick, 
            members: { [myNick]: true } 
        });
        db.ref(`user_groups/${myNick}/${gId}`).set(gName);
    }

    // Шаг 1: Отправка приглашения другу
    function addMemberToGroup(gId, gName) {
        const targetNick = prompt(`Введите ник друга для приглашения в "${gName}":`);
        if (!targetNick) return;

        db.ref(`users/${targetNick}`).once('value', snap => {
            if (!snap.exists()) return alert("Пользователь не найден!");

            db.ref(`requests/${targetNick}/invite_${gId}`).set({
                type: 'group_invite',
                gId: gId,
                gName: gName,
                from: myNick
            });
            alert(`Приглашение отправлено игроку ${targetNick}!`);
        });
    }

    // Шаг 2: Друг принял -> Отправляем запрос Админу на одобрение
    function acceptGroupInvite(reqKey, gId, gName) {
        db.ref(`requests/${myNick}/${reqKey}`).remove();
        db.ref(`groups/${gId}/admin`).once('value', s => {
            const admin = s.val();
            if (!admin) return alert("Группа больше не существует.");

            if (admin === myNick) {
                // Если создатель сам себя принял
                db.ref(`groups/${gId}/members/${myNick}`).set(true);
                db.ref(`user_groups/${myNick}/${gId}`).set(gName);
            } else {
                db.ref(`requests/${admin}/approval_${gId}_${myNick}`).set({
                    type: 'group_admin_approval',
                    gId: gId,
                    gName: gName,
                    user: myNick
                });
                alert("Заявка отправлена администратору группы!");
            }
        });
    }

    // Шаг 3: Админ одобряет
    function approveGroupMember(reqKey, gId, userNick, gName) {
        db.ref(`requests/${myNick}/${reqKey}`).remove();
        db.ref(`groups/${gId}/members/${userNick}`).set(true);
        db.ref(`user_groups/${userNick}/${gId}`).set(gName);
        alert(`Игрок ${userNick} официально принят в группу!`);
    }

    // Админ удаляет участника из группы
    function removeMemberFromGroup(gId, userNick) {
        if (!confirm(`Исключить ${userNick} из группы?`)) return;
        db.ref(`groups/${gId}/members/${userNick}`).remove();
        db.ref(`user_groups/${userNick}/${gId}`).remove();
        viewGroupMembers(gId, "");
    }

    function leaveGroup(gId, gName) {
        if (!confirm(`Выйти из группы "${gName}"?`)) return;
        
        db.ref(`groups/${gId}`).once('value', s => {
            const gData = s.val();
            if (!gData) return;

            db.ref(`groups/${gId}/members/${myNick}`).remove();
            db.ref(`user_groups/${myNick}/${gId}`).remove();

            // Передача прав админа, если админ выбыл
            if (gData.admin === myNick) {
                const members = Object.keys(gData.members || {}).filter(m => m !== myNick);
                if (members.length > 0) {
                    db.ref(`groups/${gId}/admin`).set(members[0]);
                }
            }
        });
    }

    function listenGroups() {
        db.ref(`user_groups/${myNick}`).on('value', s => {
            const groups = s.val() || {};
            const gDiv = document.getElementById('groupsListDisplay');
            gDiv.innerHTML = "<h4 style='margin:10px 0 4px 0; font-size:12px;'>Группы:</h4>";
            
            for (let gId in groups) {
                db.ref(`groups/${gId}`).on('value', gSnap => {
                    const gData = gSnap.val();
                    if (!gData) return;

                    const isAdmin = gData.admin === myNick;

                    gDiv.innerHTML += `
                        <div class="g-item">
                            <div style="display:flex; justify-content:space-between; align-items:center;">
                                <b>👥 ${gData.name}</b>
                                <span style="font-size:9px; color:#aaa;">${isAdmin ? '👑 Админ' : 'Участник'}</span>
                            </div>
                            <div class="btn-row">
                                <button class="chat-btn mini-btn" onclick="openChat('${gId}', 'group', '${gData.name}')">💬 Чат</button>
                                <button class="add-btn mini-btn" onclick="addMemberToGroup('${gId}', '${gData.name}')">➕ В группу</button>
                                <button class="track-btn mini-btn" onclick="viewGroupMembers('${gId}', '${gData.name}')">👥 Инфо</button>
                                <button class="del-btn mini-btn" onclick="leaveGroup('${gId}', '${gData.name}')">🚪 Выйти</button>
                            </div>
                        </div>`;
                });
            }
        });
    }

    function viewGroupMembers(gId, gName) {
        db.ref(`groups/${gId}`).once('value', s => {
            const gData = s.val();
            if (!gData) return;
            if (gName) document.getElementById('membersTitle').innerText = "Группа: " + gName;
            const container = document.getElementById('membersList');
            container.innerHTML = '';
            const members = gData.members || {};
            const isAdmin = gData.admin === myNick;

            for (let mNick in members) {
                const role = mNick === gData.admin ? ' 👑 (Админ)' : '';
                const removeBtn = (isAdmin && mNick !== myNick) ? `<button class="mini-btn del-btn" onclick="removeMemberFromGroup('${gId}', '${mNick}')">❌ Исключить</button>` : '';

                container.innerHTML += `
                    <div style="padding:6px 0; border-bottom:1px solid #444; font-size:12px; display:flex; justify-content:space-between; align-items:center;">
                        <div><b>${mNick}</b><span style="color:orange;">${role}</span></div>
                        <div class="btn-row">
                            <button class="mini-btn track-btn" onclick="toggleFriendTrack('${mNick}')">🗺️ Трек</button>
                            ${removeBtn}
                        </div>
                    </div>`;
            }
            document.getElementById('membersBox').style.display = 'block';
        });
    }

    function closeMembersModal() { document.getElementById('membersBox').style.display = 'none'; }

    function listenFriends() {
        db.ref(`friends/${myNick}`).on('value', s => {
            const friends = s.val() || {};
            const listDiv = document.getElementById('friendsListDisplay');
            listDiv.innerHTML = "<h4 style='margin:10px 0 4px 0; font-size:12px;'>Друзья:</h4>";
            for (let fName in friends) {
                const isUnread = unreadMap[fName] ? '<span class="unread-badge">🔴</span>' : '';
                
                listDiv.innerHTML += `
                    <div class="f-item" id="friend-card-${fName}">
                        <div style="display:flex; justify-content:space-between;">
                            <b>${fName}</b> ${isUnread}
                        </div>
                        <div class="btn-row">
                            <button class="chat-btn mini-btn" onclick="openChat('${fName}', 'user')">💬 Чат</button>
                            <button class="track-btn mini-btn" onclick="toggleFriendTrack('${fName}')">🗺️ Трек</button>
                            <button class="del-btn mini-btn" onclick="deleteFriend('${fName}')">✕</button>
                        </div>
                    </div>`;

                listenUnreadMessages(fName);

                db.ref(`users/${fName}`).on('value', userSnap => {
                    const u = userSnap.val();
                    if (!u || !u.pos) return;
                    const color = u.color || "#00ff00";

                    if (visibleTracks[fName]) drawFriendTrack(fName, u);

                    if (markers[fName]) {
                        markers[fName].setLatLng([u.pos.lat, u.pos.lon]).setStyle({ fillColor: color });
                    } else {
                        markers[fName] = L.circleMarker([u.pos.lat, u.pos.lon], { radius: 8, fillColor: color, color: "white", weight: 2, fillOpacity: 0.9 })
                            .addTo(map).bindPopup(`<b>${fName}</b>`);
                    }
                });
            }
        });
    }

    function listenUnreadMessages(fName) {
        const chatId = getChatId(fName);
        db.ref(`chats/${chatId}`).limitToLast(1).on('child_added', s => {
            const msg = s.val();
            if (msg && msg.from === fName && activeChatId !== chatId) {
                unreadMap[fName] = true;
            }
        });
    }

    function getChatId(fNick) { return myNick < fNick ? `${myNick}_${fNick}` : `${fNick}_${myNick}`; }

    function handleTyping() {
        if (!activeChatId) return;
        db.ref(`typing/${activeChatId}/${myNick}`).set(Date.now());
        clearTimeout(typingTimeout);
        typingTimeout = setTimeout(() => { db.ref(`typing/${activeChatId}/${myNick}`).remove(); }, 2500);
    }

    function openChat(targetId, type, titleName = "") {
        if (activeChatId) closeChat();
        closeChatsListModal();
        activeChatType = type;
        
        if (type === 'user') {
            activeChatId = getChatId(targetId);
            document.getElementById('chatTitle').innerText = "💬 " + targetId;
            unreadMap[targetId] = false;
        } else {
            activeChatId = targetId;
            document.getElementById('chatTitle').innerText = "👥 " + titleName;
        }

        document.getElementById('chatBox').style.display = 'flex';

        db.ref(`typing/${activeChatId}`).on('value', s => {
            const typers = s.val() || {};
            const now = Date.now();
            const names = Object.keys(typers).filter(n => n !== myNick && (now - typers[n] < 3000));
            document.getElementById('typingStatus').innerText = names.length ? `${names.join(', ')} печатает...` : '';
        });

        db.ref(`chats/${activeChatId}`).on('value', s => {
            const msgs = s.val() || {};
            const container = document.getElementById('chatMessages');
            container.innerHTML = '';
            
            for (let id in msgs) {
                const m = msgs[id];
                const isMy = m.from === myNick;
                const senderLabel = type === 'group' && !isMy ? `<div style="font-size:10px; color:#ff9800; margin-bottom:2px;">${m.from}</div>` : '';
                container.innerHTML += `<div class="msg ${isMy ? 'my' : ''}">${senderLabel}${m.text}</div>`;
            }
            container.scrollTop = container.scrollHeight;
        });
    }

    function closeChat() {
        document.getElementById('chatBox').style.display = 'none';
        if (activeChatId) {
            db.ref(`chats/${activeChatId}`).off();
            db.ref(`typing/${activeChatId}/${myNick}`).remove();
            db.ref(`typing/${activeChatId}`).off();
            activeChatId = null;
        }
    }

    function sendMsg() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !activeChatId) return;
        
        db.ref(`typing/${activeChatId}/${myNick}`).remove();
        db.ref(`chats/${activeChatId}`).push({ from: myNick, text: text, time: Date.now() });
        input.value = '';
    }
</script>
</body>
</html>
